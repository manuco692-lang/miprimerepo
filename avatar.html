<style>
:root{--g0:#0A3323;--musgo:#839958;--beige:#F7F4D5;--rosa:#D3968C;--mid:#105666;--gold:#E9C46A;--ink:#06180F;--muted:rgba(247,244,213,.66);--display:'Cormorant Garamond',Georgia,serif;--body:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--beige);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}

.top h1{margin:0;flex:1;font:600 22px/1.1 var(--display);letter-spacing:.01em}

.plan{font:800 10px var(--body);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:rgba(233,196,106,.15);color:var(--gold);border:1px solid rgba(233,196,106,.35)}
.stage{position:relative;flex:1 1 auto;min-height:300px;background:radial-gradient(70% 55% at 50% 38%,var(--aura,rgba(16,86,102,.85)) 0%,rgba(10,51,35,.95) 55%,#05140d 100%);overflow:hidden;touch-action:pan-y}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.motes{position:absolute;inset:0;pointer-events:none;z-index:1}
.motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFE7A8;box-shadow:0 0 8px 2px rgba(255,214,140,.6);opacity:0;animation:mote 9s linear infinite}
@keyframes mote{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.6}100%{transform:translateY(-140px);opacity:0}}
.load{position:absolute;inset:0;display:grid;place-items:center;z-index:2;background:rgba(5,20,13,.35);transition:opacity .4s}
.load.off{opacity:0;pointer-events:none}
.load div{text-align:center;font:600 13px var(--body);color:var(--muted)}
.load b{display:block;width:44px;height:44px;margin:0 auto 10px;border-radius:50%;border:2px solid rgba(233,196,106,.2);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.view{position:absolute;top:calc(max(12px,env(safe-area-inset-top)) + 54px);left:50%;transform:translateX(-50%);z-index:2;display:flex;background:rgba(5,20,13,.55);border:1px solid rgba(247,244,213,.14);border-radius:99px;padding:3px;backdrop-filter:blur(6px)}
.view button{border:0;background:transparent;color:var(--muted);font:700 12px var(--body);padding:7px 12px;border-radius:99px;cursor:pointer}

.hint{position:absolute;bottom:26px;left:0;right:0;text-align:center;z-index:2;font:600 11px var(--body);color:rgba(247,244,213,.55);letter-spacing:.06em;pointer-events:none}
.name{position:absolute;left:14px;bottom:44px;z-index:2;pointer-events:none}
.name b{display:block;font:600 24px/1 var(--display)}
.name small{font:700 10px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--rosa)}
.panel{flex:0 0 auto;background:linear-gradient(180deg,#0B2A1D,#071A11);border-top:1px solid rgba(233,196,106,.25);border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:3;padding:12px 0 calc(12px + env(safe-area-inset-bottom));max-height:44vh;display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 14px 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid rgba(247,244,213,.16);background:rgba(247,244,213,.05);color:var(--muted);font:700 12.5px var(--body);padding:8px 13px;border-radius:99px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--gold);border-color:var(--gold);color:#2A1608}
.body{overflow-y:auto;padding:0 14px 6px;flex:1}
.sec{margin:2px 0 12px}
.sec h4{margin:0 0 7px;font:800 10.5px var(--body);letter-spacing:.16em;text-transform:uppercase;color:#C9D6A4}

.opt{position:relative;border:1px solid rgba(247,244,213,.18);background:rgba(247,244,213,.05);color:var(--beige);font:600 12.5px var(--body);padding:8px 12px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opt.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}

.tier{font:800 8.5px var(--body);letter-spacing:.08em;color:#2A1608;background:var(--gold);border-radius:6px;padding:1px 5px}

.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(247,244,213,.22);cursor:pointer;position:relative;padding:0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.sw .tier{position:absolute;top:-4px;right:-4px;font-size:0;width:13px;height:13px;padding:0;border-radius:50%;display:grid;place-items:center}
.sw .tier::after{content:'✦';font-size:8px;line-height:1;color:#2A1608}
.sw.orig{background:conic-gradient(from 0deg,#d8b49a,#6e4a33,#2c2c2c,#d8b49a);}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}

.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.look{text-align:left;border:1px solid rgba(247,244,213,.16);border-radius:14px;padding:10px;background:linear-gradient(135deg,rgba(16,86,102,.45),rgba(10,51,35,.6));color:var(--beige);cursor:pointer;position:relative}
.look b{display:block;font:600 17px var(--display)}
.look small{font:500 11px/1.3 var(--body);color:var(--muted)}
.look .tier{position:absolute;top:8px;right:8px}
.signs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}

.sg.on{border-color:var(--gold);color:var(--gold)}

.ghost{border:1px solid rgba(247,244,213,.2);border-radius:14px;padding:13px 14px;background:transparent;color:var(--beige);font:700 13px var(--body);cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;transition:.3s;z-index:9;background:#F7F4D5;color:#0A3323;font:700 13px var(--body);padding:10px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{border:0;background:#0A3323;color:#F7F4D5;font:700 12px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer}
.sl{display:flex;align-items:center;gap:10px;margin:7px 0}.sl span{flex:0 0 118px;font:600 12px var(--body);color:var(--muted)}.sl input{flex:1;accent-color:#E9C46A;min-width:0}
.pick{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--body);color:var(--muted);cursor:pointer}.pick input{width:40px;height:34px;border:2px solid rgba(247,244,213,.25);border-radius:10px;background:none;padding:2px;cursor:pointer}
.note{font-size:11.5px;color:var(--muted);margin:0 0 6px}
.nogl{padding:30px 20px;text-align:center;color:var(--muted)}
@media (min-width:860px){body{flex-direction:row}.stage{flex:1 1 60%}.panel{flex:0 0 400px;max-height:none;margin-top:0;border-radius:0;border-top:0;border-left:1px solid rgba(233,196,106,.25)}.topwrap{position:absolute;left:0;top:0;right:400px;z-index:4}}
@media (prefers-reduced-motion:reduce){.motes i{animation:none;opacity:0}}

.view{display:none}
.sl{display:flex;align-items:center;gap:10px;margin:7px 0}.sl span{flex:0 0 118px;font:600 12px var(--body);color:var(--muted)}.sl input{flex:1;accent-color:#E9C46A;min-width:0}
.sty{position:relative;text-align:left;border:1px solid rgba(247,244,213,.16);border-radius:14px;padding:10px;color:#fff;cursor:pointer;min-height:64px}
.sty b{display:block;font:600 17px var(--display);text-shadow:0 1px 8px rgba(0,0,0,.45)}.sty small{font:500 11px/1.3 var(--body);color:rgba(255,255,255,.9);text-shadow:0 1px 6px rgba(0,0,0,.45)}
.sty.on{box-shadow:0 0 0 2px #E9C46A}.sty .tier{position:absolute;top:8px;right:8px}.sty.lock{opacity:.7}
</style>

document.addEventListener('change',e=>{if(e.target.closest('[data-pick]'))renderPanel()});

$('rnd').onclick=()=>{const pk=L=>{const ok=L.filter(x=>can(x[x.length-1]==='free'||x[x.length-1]==='cos'||x[x.length-1]==='arc'?x[x.length-1]:x[2]));return ok[Math.floor(Math.random()*ok.length)][0]};
  st.style=pk(STY.map(x=>[x[0],x[5]]));st.sil=SIL[Math.floor(Math.random()*3)][0];const f=FORMA[Math.floor(Math.random()*FORMA.length)];st.forma=f[0];st.b=Object.assign({},f[2]);st.pose=pk(POSE);st.corona=pk(CORONA);st.ropa=Math.random()<.4?'no':pk(ROPA);st.obj=Math.random()<.3?'no':pk(OBJ);st.marca=Math.random()<.5?'no':pk(MARCA);st.parts=pk(PART);st.joyas=JOYAS.filter(j=>can(j[2])&&Math.random()<.3).map(j=>j[0]);st.own='';applyAll();renderPanel()};

/* ================= guardar ================= */
function snap(){const w=320;const oldS=new THREE.Vector2();R.getSize(oldS);const oa=cam.aspect,op=cam.position.clone(),oq=cam.quaternion.clone();const y0=pivot.rotation.y;
  R.setPixelRatio(1);R.setSize(w,w,false);cam.aspect=1;cam.updateProjectionMatrix();cam.position.set(0,1.55,1.55);cam.lookAt(0,1.53,0);pivot.rotation.y=0;R.render(scene,cam);const url=R.domElement.toDataURL('image/webp',.88);
  pivot.rotation.y=y0;R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(oldS.x,oldS.y,false);cam.aspect=oa;cam.updateProjectionMatrix();cam.position.copy(op);cam.quaternion.copy(oq);return url}
$('save').onclick=()=>{const a=snap();const s=find(STY,st.style);const sg=SIGNS[st.sign];const id='a'+Date.now().toString(36);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="${id}g" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="${s[3]}" stop-opacity=".55"/><stop offset=".6" stop-color="#0A3323"/><stop offset="1" stop-color="#06180F"/></radialGradient><radialGradient id="${id}h" cx="50%" cy="38%" r="50%"><stop offset="0" stop-color="${s[4]}" stop-opacity=".7"/><stop offset="1" stop-color="${s[4]}" stop-opacity="0"/></radialGradient><clipPath id="${id}c"><circle cx="50" cy="50" r="50"/></clipPath></defs><g clip-path="url(#${id}c)"><rect width="100" height="100" fill="url(#${id}g)"/><circle cx="50" cy="40" r="40" fill="url(#${id}h)"><animate attributeName="opacity" values=".5;1;.5" dur="4s" repeatCount="indefinite"/></circle><image href="${a}" x="0" y="0" width="100" height="100"/></g>${sg?`<circle cx="84" cy="84" r="11" fill="#0A3323" stroke="#E9C46A" stroke-width="2"/><text x="84" y="88.5" text-anchor="middle" font-size="12" fill="#F7F4D5">${sg[0]}&#xFE0E;</text>`:''}</svg>`;
  try{localStorage.setItem('tbe_av4',JSON.stringify(st));localStorage.setItem('tbe_av2_svg',svg);localStorage.setItem('tbe_avatar','mio')}catch(e){toast('No pude guardar: tu navegador no tiene espacio');return}
  toast('Tu alma de luz quedó guardada en tu perfil ✓');post({tbeAva:'saved'});setTimeout(()=>post({tbeAva:'close'}),1400)};

renderPanel();resize();
setTimeout(()=>{applyAll();$('load').classList.add('off');requestAnimationFrame(loop)},30);
window.__tbe3d={ready:()=>!!bodyMesh,st:()=>st,set:o=>{Object.assign(st,o);applyAll();renderPanel()},yaw:v=>{yaw=v;vy=0},R,scene,cam,U};
</script>
</body></html>
